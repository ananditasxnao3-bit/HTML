<html>
<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
<div>

<form id="guestForm">
<br>
<label for=”weight”> Weight : </label>
<input type=”text” id="weight">
<br>
<label for=”date”>Date : </label>
<input type="date" id="date">
<br>
<input type="submit">
<br>
</form>

</div>

https://ijzkskdqtdculfvqnfdi.supabase.co/rest/v1/Weight_Info
    <div id="status"></div>
<script>
    // Replace these with your Supabase credentials
    const SUPABASE_URL = "https://ijzkskdqtdculfvqnfdi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aQG0ooLtBcy_PZT-e2jIJw_vSzZdB98";

    const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

    const form = document.getElementById("guestForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const Weight = document.getElementById("weight").value.trim();
        const Date = document.getElementById("date").value.trim();

        status.textContent = "Saving...";
        status.className = "";

       const { error } = await supabaseClient
    .from("Weight_Info")
    .insert([
        {
            Weight,
            Date
        }
    ]);
        if (error) {
            console.error(error);

            status.textContent = "❌ " + error.message;
            status.className = "error";
        } else {
            status.textContent = "✅ Message saved successfully!";
            status.className = "success";

            form.reset();
        }
    });
</script>



</body>
</html>
