<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Guestbook</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</head>
<body>

<div class="container">
    <h2>Guest Book</h2>

    <form id="guestForm">
        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <textarea
            id="message"
            placeholder="Write your message..."
            required
        ></textarea>

        <button type="submit">Submit</button>
    </form>

    <div id="status"></div>
</div>

<script>
    // Replace these with your Supabase credentials
    const SUPABASE_URL = "https://ijzkskdqtdculfvqnfdi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aQG0ooLtBcy_PZT-e2jIJw_vSzZdB98";

    const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

    const form = document.getElementById("guestForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const message = document.getElementById("message").value.trim();

        status.textContent = "Saving...";
        status.className = "";

       const { error } = await supabaseClient
    .from("NewGuestBook")
    .insert([
        {
            name,
            message
        }
    ]);
        if (error) {
            console.error(error);

            status.textContent = "❌ " + error.message;
            status.className = "error";
        } else {
            status.textContent = "✅ Message saved successfully!";
            status.className = "success";

            form.reset();
        }
    });
</script>

</body>
</html>
